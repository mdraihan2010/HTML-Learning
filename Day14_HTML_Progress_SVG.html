<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Progress Bar and SVG Practice</title>
  </head>
  <body>
    <h1>HTML Progress Bar and SVG Practice</h1>

    <p>Progress Bar Example:</p>
    <progress value="70" max="100"></progress>
    <br />
    <p>SVG Example:</p>
    <img
      src="coconut-tree-svgrepo-com.svg"
      alt="Coconut Tree"
      width="100"
      height="100"
    />
    <br />
    <svg width="100" height="100">
      <circle
        cx="50"
        cy="50"
        r="40"
        stroke="black"
        stroke-width="3"
        fill="red"
      />
    </svg>
  </body>
</html>
